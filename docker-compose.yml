# NotIA · PostgreSQL para desarrollo local. No se usa en producción.
#
# Todos los comandos llevan --env-file backend/.env, porque de ahí salen las
# contraseñas (el archivo está en .gitignore):
#
#   docker compose --env-file backend/.env up -d       levanta la base
#   docker compose --env-file backend/.env logs db     muestra sus registros
#   docker compose --env-file backend/.env down        la detiene (los datos quedan en el volumen)
#   docker compose --env-file backend/.env down -v     la detiene y BORRA los datos locales
#
# El contenedor recibe solo las variables que aparecen en "environment". Las
# llaves de Django (DJANGO_SECRET_KEY, JWT_SIGNING_KEY, MFA_ENCRYPTION_KEY) y
# el resto de backend/.env no entran al contenedor.
name: notia

services:
  db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      # Superusuario del contenedor: solo crea la base y los roles.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Usa docker compose --env-file backend/.env up -d}
      # Las lee backend/db/roles.sql al crear la base.
      DB_NAME: ${DB_NAME:-notia}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Falta DB_OWNER_PASSWORD en backend/.env}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en backend/.env}
    ports:
      # Solo accesible desde este computador.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - notia_pgdata:/var/lib/postgresql/data
      # Se ejecuta una sola vez, al crear el volumen: crea la base y los roles
      # notia_owner y notia_app con privilegios mínimos.
      - ./backend/db/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      # roles.sql incluye los permisos de esta carpeta. Al ser una carpeta, el
      # arranque de PostgreSQL no la ejecuta por su cuenta.
      - ./backend/db/permisos:/docker-entrypoint-initdb.d/permisos:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  notia_pgdata:
