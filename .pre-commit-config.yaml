# NotIA · Revisiones locales antes de cada commit
#
# Atajan en tu computador lo mismo que después revisa el CI. Se instala una
# sola vez, con el entorno virtual del backend activado, desde la raíz:
#
#   pre-commit install
#
# Para revisar todo el repositorio a mano:  pre-commit run --all-files
#
# Cada repositorio está fijado al commit exacto de su versión.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # Fin de línea: un solo estilo por archivo y salto de línea al final.
      - id: mixed-line-ending
      - id: end-of-file-fixer
      # En Markdown, dos espacios al final de una línea son un salto de línea.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # v0.17.5, la misma versión de requirements/dev.txt
    hooks:
      - id: ruff-check
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      # Revisa lo que está por entrar al commit, con las excepciones de .gitleaks.toml.
      - id: gitleaks
